---
name: '🔄 Rclone Action'

on:
  push:
    branches: [main]
    paths:
      - 'r2/**'
  workflow_dispatch: {}

jobs:
  sync:
    if: github.repository == 'digital-clouds/space'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      local_path: './r2'
      remote_path: 'r2:space'
    steps:
      - name: '⤵️ Check out code from GitHub'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: '⏫ Run rclone'
        uses: digital-clouds/rclone-action@2844812fbdadaa89e5047136a3fcd0f3a2fb3b51 # v1.0.0
        with:
          config: ${{ secrets.R2_RCLONE_CONFIG }}
          args: 'copy -M ${{ env.local_path }} ${{ env.remote_path }}'
          debug: false

---
name: "🔄 Rclone Action"

on:
  push:
    branches: [main]
    paths:
      - "r2/**"
  workflow_dispatch: {}

jobs:
  sync:
    if: github.repository == 'digital-clouds/space'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      local_path: "./r2"
      remote_path: "r2:space"
    steps:
      - name: "⤵️ Check out code from GitHub"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "⏫ Run rclone"
        uses: digital-clouds/rclone-action@92458fad31e342e651ba19073fa568bccb5fa096 # main
        with:
          config: ${{ secrets.R2_RCLONE_CONFIG }}
          args: "copy -M ${{ env.local_path }} ${{ env.remote_path }}"
          debug: false

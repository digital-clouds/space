version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'

  # Root workspace npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
      dependencies:
        dependency-type: 'production'
        patterns:
          - '*'

  # digital-space worker npm dependencies
  - package-ecosystem: 'npm'
    directory: '/workers/digital-space'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'digital-space'
    groups:
      worker-dependencies:
        patterns:
          - '*'

  # gcp-space worker npm dependencies
  - package-ecosystem: 'npm'
    directory: '/workers/gcp-space'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'gcp-space'
    groups:
      worker-dependencies:
        patterns:
          - '*'

  # ipfs-space worker npm dependencies
  - package-ecosystem: 'npm'
    directory: '/workers/ipfs-space'
    schedule:
      interval: 'daily'
      time: '04:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'ipfs-space'
    groups:
      worker-dependencies:
        patterns:
          - '*'

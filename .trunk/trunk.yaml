version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
repo:
  repo:
    host: github.com
    owner: digital-clouds
    name: space
lint:
  disabled:
    - yamllint
    - checkov
    - osv-scanner
    - trivy
    - trufflehog
    - gitleaks
    - renovate
  enabled:
    - grype@0.110.0
    - pinact@4.0.0
    - actionlint@1.7.8
    - eslint@9.27.0
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
    - svgo@4.0.2
    - taplo@0.10.0
  ignore:
    - linters: [ALL]
      paths:
        - r2/**
        - gcs/**
        - ipfs/**
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
